<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar Sesión - Avicultura Inteligente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-success bg-opacity-10 d-flex align-items-center min-vh-100">
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card shadow border-0">
        <div class="card-header bg-success text-white text-center py-3">
          <h4 class="mb-0">Avicultura Inteligente</h4>
          <small>Gestión Avícola - Villa Gorgona (TRL5)</small>
        </div>
        <div class="card-body p-4">
          {% for message in messages %}
            <div class="alert alert-danger py-2">{{ message }}</div>
          {% endfor %}
          <form method="post">
            {% csrf_token %}
            <div class="mb-3">
              <label class="form-label">Usuario</label>
              <input type="text" name="username" class="form-control" required placeholder="admin o productor">
            </div>
            <div class="mb-3">
              <label class="form-label">Contraseña</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Ingresar</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
