{% extends 'granjas/base.html' %}
{% block content %}
<h3>Registro de Producción (RF03)</h3>
<div class="row g-4">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-header bg-success text-white">Nuevo Registro</div>
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          <div class="mb-2">
            <label class="form-label">Lote *</label>
            <select name="lote_id" class="form-select" required>
              {% for l in lotes %}<option value="{{ l.id }}">{{ l.codigo }} - {{ l.granja.nombre }}</option>{% endfor %}
            </select>
          </div>
          <div class="mb-2"><label class="form-label">Fecha *</label><input type="date" name="fecha" class="form-control" required></div>
          <div class="mb-2"><label class="form-label">Cantidad (huevos o kg) *</label><input type="number" name="cantidad" class="form-control" min="1" required></div>
          <div class="mb-3"><label class="form-label">Observación</label><input name="observacion" class="form-control"></div>
          <button class="btn btn-success w-100">Guardar Producción</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body table-responsive">
        <table class="table table-striped">
          <thead><tr><th>Fecha</th><th>Granja</th><th>Lote</th><th>Cantidad</th><th>Observación</th></tr></thead>
          <tbody>
            {% for r in registros %}
            <tr><td>{{ r.fecha }}</td><td>{{ r.lote.granja.nombre }}</td><td>{{ r.lote.codigo }}</td><td>{{ r.cantidad }}</td><td>{{ r.observacion }}</td></tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
{% endblock %}
